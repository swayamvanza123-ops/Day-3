<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Inventory Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">📦</div>

            <div>
                <h2>Inventory</h2>
                <span>Management</span>
            </div>
        </div>


        <nav>

            <a href="index.html" class="nav-link">
                <span>📊</span>
                Dashboard
            </a>

            <a href="products.html" class="nav-link active">
                <span>📦</span>
                Products
            </a>

        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="top-header">

            <div>
                <p class="welcome">Inventory Management</p>
                <h1>Products</h1>
            </div>

        </header>


        <!-- Add Product -->
        <section class="add-product">

            <div class="section-header">

                <div>
                    <h2>Add New Product</h2>
                    <p>Add a product to your inventory</p>
                </div>

            </div>


            <div class="form-row">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                >


                <select id="productCategory">

                    <option value="">
                        Select Category
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>


                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price"
                    min="1"
                >


                <input
                    type="number"
                    id="productStock"
                    placeholder="Stock"
                    min="0"
                >


                <button
                    id="addProduct"
                    class="add-btn"
                >
                    + Add Product
                </button>

            </div>

        </section>


        <!-- Filters -->
        <section class="filters">

            <input
                type="text"
                id="searchProduct"
                placeholder="🔍 Search Product..."
            >


            <select id="stockFilter">

                <option value="all">
                    All Products
                </option>

                <option value="available">
                    Available
                </option>

                <option value="low-stock">
                    Low Stock
                </option>

            </select>


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Accessories">
                    Accessories
                </option>

            </select>


            <button
                id="clearFilters"
                class="clear-btn"
            >
                Clear
            </button>

        </section>


        <!-- Product Table -->
        <section class="table-container">

            <div class="section-header">

                <div>
                    <h2>All Products</h2>
                    <p>Manage your inventory products</p>
                </div>

                <div class="product-count">
                    <span id="totalProducts">0</span>
                    Products
                </div>

            </div>


            <table>

                <thead>

                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                    </tr>

                </thead>


                <tbody id="productTable">
                </tbody>

            </table>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
